<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Эксклюзивные бонусы</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
        }

        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            /* 1) Розовый неон заменен на неоновый голубой */
            border: 2px solid #00f0ff;
            box-shadow: 0 0 15px #00f0ff;
            margin-bottom: 20px;
        }

        /* 2) Изменен текст и убраны смайлики */
        .title {
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1px;
            color: #ffffff;
            margin-bottom: 20px;
        }

        .card {
            background-color: #1c1c1e;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            /* 1) Розовый неон заменен на неоновый голубой */
            border: 1px solid #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 4) Смайлик медведя 🐻 и 5) LUCKYBEAR */
        .brand {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 16px;
        }

        /* 6) Плашка поднята выше цифр */
        .bonus-badge {
            background-color: #2c2c2e;
            color: #aeaeb2;
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 12px;
            margin-bottom: 8px;
            display: inline-block;
        }

        /* 5) Изменено значение бонуса */
        .bonus-value {
            font-size: 32px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 20px;
        }

        /* 3) Текст кнопки изменен, смайлики оставлены */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            color: #000000;
            text-decoration: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            width: 100%;
            box-sizing: border-box;
            transition: background-color 0.2s;
        }

        .btn:active {
            background-color: #e5e5ea;
        }

        .btn-icon {
            margin: 0 8px;
        }

        /* 7) Измененный футер */
        .footer-text {
            font-size: 12px;
            color: #8e8e93;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 8) Аватарка изменена на твою (поддерживает и исходное имя, и avatar.jpg) -->
        <img class="avatar" src="avatar.jpg" onerror="this.src='ЩАС ЧО.jpg'; this.onerror=null;" alt="Avatar">

        <!-- 2) "Эксклюзивные бонусы" заменено на "ОФИЦИАЛЬНЫЙ КАНАЛ" без смайликов -->
        <div class="title">ОФИЦИАЛЬНЫЙ КАНАЛ</div>

        <div class="card">
            <!-- 4) Смайлик медведя и 5) LUCKYBEAR -->
            <div class="brand">🐻 LUCKYBEAR</div>
            
            <!-- 6) Приветственный бонус поднят НАД цифрами -->
            <div class="bonus-badge">Приветственный бонус</div>
            
            <!-- 5) Значение заменено на 360% + 250 FS -->
            <div class="bonus-value">360% + 250 FS</div>

            <!-- 3) Текст заменен на "Перейти в TELEGRAM", смайлики на месте -->
            <a href="https://t.me/+ССЫЛКА" class="btn">
                <span class="btn-icon">✈️</span>
                Перейти в TELEGRAM
                <span class="btn-icon">🚀</span>
            </a>
        </div>

        <!-- 7) Новый текст в футере -->
        <div class="footer-text">
            ANAR • Доступ к каналу
        </div>
    </div>

</body>
</html>
