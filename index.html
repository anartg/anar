<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANAR • Официальный канал</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #030014;
        }
        /* 1) Замена неонового розового свечения на неоновый голубой цвет */
        .neon-glow {
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.25), 0 0 80px rgba(0, 240, 255, 0.15);
        }
        .text-neon {
            color: #00f0ff;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
        }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex items-center justify-center p-4 relative overflow-x-hidden">
    
    <!-- Фоновые градиенты оригинального лендинга (перекрашены в неоновый голубой) -->
    <div class="absolute top-[-20%] left-[-10%] w-[600px] h-[600px] rounded-full bg-cyan-900/10 blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-[-20%] right-[-10%] w-[600px] h-[600px] rounded-full bg-blue-950/20 blur-[120px] pointer-events-none"></div>

    <div class="w-full max-w-[440px] z-10 flex flex-col items-center">
        
        <!-- 8) Аватарка в самом верху изменена на загруженную ava.jpg -->
        <div class="relative group mb-6">
            <div class="absolute -inset-0.5 bg-gradient-to-r from-cyan-400 to-blue-500 rounded-full blur opacity-60 group-hover:opacity-100 transition duration-1000 group-hover:duration-200 animate-tilt"></div>
            <img src="ava.jpg" alt="ANAR" class="relative w-24 h-24 rounded-full object-cover border-2 border-cyan-400/50 p-[2px] bg-slate-950">
        </div>

        <!-- 2) "Эксклюзивные бонусы" заменено на "ОФИЦИАЛЬНЫЙ КАНАЛ", смайлики убраны -->
        <h1 class="text-sm font-bold tracking-[0.2em] text-slate-400 uppercase mb-8 text-center">
            ОФИЦИАЛЬНЫЙ КАНАЛ
        </h1>

        <!-- Основная карточка -->
        <div class="w-full bg-slate-950/60 backdrop-blur-xl border border-slate-800/80 rounded-3xl p-6 mb-6 neon-glow relative overflow-hidden">
            <div class="absolute top-0 left-0 right-0 h-[1px] bg-gradient-to-r from-transparent via-cyan-500/30 to-transparent"></div>
            
            <div class="flex flex-col items-center text-center">
                
                <!-- 4) Смайлик огня изменен на 🐻 и 5) SPINTO заменено на LUCKYBEAR -->
                <div class="flex items-center gap-2 mb-4 bg-slate-900/80 border border-slate-800 px-4 py-1.5 rounded-full">
                    <span class="text-lg">🐻</span>
                    <span class="text-sm font-extrabold tracking-wider text-white">LUCKYBEAR</span>
                </div>

                <!-- 6) Плашка "Приветственный бонус" поднята над числовыми значениями бонуса -->
                <span class="text-xs font-bold tracking-widest text-cyan-400 uppercase mb-3 bg-cyan-950/30 border border-cyan-800/30 px-3 py-1 rounded-md">
                    Приветственный бонус
                </span>

                <!-- 5) Значение бонуса заменено на 360% + 250 FS -->
                <div class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-b from-white to-slate-400 mb-6 tracking-tight">
                    360% + 250 FS
                </div>

                <!-- 3) Текст кнопки изменен на "Перейти в TELEGRAM", оригинальные смайлики на месте -->
                <a href="https://t.me/+ССЫЛКА_НА_КАНАЛ" class="w-full relative group/btn flex items-center justify-center gap-3 bg-white hover:bg-slate-100 text-slate-950 font-bold py-4 px-6 rounded-2xl transition-all duration-300 shadow-lg shadow-white/5 active:scale-[0.98]">
                    <span class="text-lg">✈️</span>
                    <span class="tracking-wide text-[15px]">Перейти в TELEGRAM</span>
                    <span class="text-lg">🚀</span>
                </a>

            </div>
        </div>

        <!-- 7) Текст в самом низу изменен на "ANAR • Доступ к каналу" -->
        <p class="text-xs text-slate-500 font-medium tracking-wide text-center leading-relaxed">
            ANAR • Доступ к каналу
        </p>

    </div>

</body>
</html>
