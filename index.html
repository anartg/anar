<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANAR • Официальный канал</title>
    <style>
        :root {
            --neon-color: #00f0ff;
            --neon-glow: rgba(0, 240, 255, 0.4);
            --neon-glow-intense: rgba(0, 240, 255, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #0d0d11;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 430px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        /* Аватарка */
        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 25px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--neon-color);
            box-shadow: 0 0 15px var(--neon-glow), inset 0 0 10px var(--neon-glow);
            position: relative;
            z-index: 2;
        }

        .avatar-pulse {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: transparent;
            border: 2px solid var(--neon-color);
            box-shadow: 0 0 20px var(--neon-glow-intense);
            animation: pulse 2s infinite ease-in-out;
            z-index: 1;
            opacity: 0;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.08); opacity: 0.8; }
            100% { transform: scale(1.15); opacity: 0; }
        }

        /* Заголовок ОФИЦИАЛЬНЫЙ КАНАЛ без смайликов */
        .title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #8e8e93;
            margin-bottom: 25px;
            font-weight: 600;
        }

        /* Карточка оффера */
        .card {
            background: linear-gradient(135deg, rgba(20, 20, 28, 0.8) 0%, rgba(15, 15, 20, 0.9) 100%);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 30px 24px;
            margin-bottom: 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 240, 255, 0.05) 0%, transparent 70%);
            pointer-events: none;
        }

        /* Измененный брендинг (смайлик медведя 🐻) */
        .brand {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        /* Поднятый наверх Приветственный бонус */
        .bonus-badge {
            display: inline-block;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--neon-color);
            border: 1px solid var(--neon-color);
            padding: 5px 14px;
            border-radius: 50px;
            margin-bottom: 12px;
            box-shadow: 0 0 10px var(--neon-glow);
            background: rgba(0, 240, 255, 0.05);
        }

        /* Измененный размер бонуса */
        .bonus-value {
            font-size: 38px;
            font-weight: 900;
            color: #ffffff;
            line-height: 1.1;
            margin-bottom: 30px;
            letter-spacing: -0.5px;
            background: linear-gradient(180deg, #ffffff 0%, #e1e1e6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Кнопка с новым текстом */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            background: var(--neon-color);
            color: #000000;
            text-decoration: none;
            padding: 19px 30px;
            border-radius: 18px;
            font-size: 17px;
            font-weight: 700;
            box-shadow: 0 0 25px var(--neon-glow), 0 8px 20px rgba(0, 240, 255, 0.3);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
        }

        .btn:active {
            transform: scale(0.98);
            box-shadow: 0 0 15px var(--neon-glow);
        }

        /* Футер текста */
        .footer-text {
            font-size: 13px;
            color: #636366;
            font-weight: 500;
            letter-spacing: 0.3px;
            line-height: 1.4;
        }

        /* Свечение на заднем плане */
        .bg-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 240, 255, 0.08) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="container">
        <!-- Аватарка (ссылается на аватар или на оригинальное имя файла) -->
        <div class="avatar-container">
            <img class="avatar" src="avatar.jpg" onerror="this.src='ЩАС ЧО.jpg'; this.onerror=null;" alt="ANAR">
            <div class="avatar-pulse"></div>
        </div>

        <!-- 2) Блок ОФИЦИАЛЬНЫЙ КАНАЛ без смайликов -->
        <div class="title">ОФИЦИАЛЬНЫЙ КАНАЛ</div>

        <!-- Карточка оффера -->
        <div class="card">
            <!-- 4) Смайлик медведя 🐻 и 5) LUCKYBEAR -->
            <div class="brand">🐻 LUCKYBEAR</div>
            
            <!-- 6) Приветственный бонус поднят над цифрами -->
            <div class="bonus-badge">Приветственный бонус</div>
            
            <!-- 5) Измененные цифры бонуса -->
            <div class="bonus-value">360% + 250 FS</div>

            <!-- 3) Кнопка с измененным текстом, смайлики на месте -->
            <a href="https://t.me/+ССЫЛКА_НА_ТВОЙ_КАНАЛ" class="btn">
                <span>✈️</span>
                Перейти в TELEGRAM
                <span>🚀</span>
            </a>
        </div>

        <!-- 7) Измененный копирайт / футер -->
        <div class="footer-text">
            ANAR • Доступ к каналу
        </div>
    </div>

</body>
</html>
